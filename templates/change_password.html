{% extends 'base.html' %}
{% block title %}تغيير كلمة المرور | Infinite Academy{% endblock %}
{% block content %}
<div class="auth-wrap"><section class="panel auth-panel"><span class="eyebrow">INFINITE ACADEMY</span><h1>تغيير كلمة المرور</h1><p class="muted">أدخل كلمة المرور الحالية ثم اختر كلمة جديدة من 12 إلى 128 محرفاً. تغيير كلمة المرور سيُغلق الجلسات السابقة على الأجهزة الأخرى.</p><form class="form-stack" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="field"><label for="current_password">كلمة المرور الحالية</label><input id="current_password" type="password" name="current_password" maxlength="128" autocomplete="current-password" required></div><div class="field"><label for="password">كلمة المرور الجديدة</label><input id="password" type="password" name="password" minlength="12" maxlength="128" autocomplete="new-password" required></div><div class="field"><label for="confirm_password">تأكيد كلمة المرور الجديدة</label><input id="confirm_password" type="password" name="confirm_password" minlength="12" maxlength="128" autocomplete="new-password" required></div><button type="submit">تغيير كلمة المرور</button></form></section></div>
{% endblock %}
