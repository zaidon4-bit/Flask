name: Build Infinite Academy APK

on:
  workflow_dispatch:
    inputs:
      academy_base_url:
        description: 'رابط الموقع المنشور عبر HTTPS، مثال: https://academy.example.com'
        required: true
        type: string
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    # Skip the automatic push build until the public HTTPS URL exists.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ACADEMY_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ACADEMY_BASE_URL: ${{ inputs.academy_base_url || vars.ACADEMY_BASE_URL || '' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate deployed HTTPS origin
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ACADEMY_BASE_URL:-}" ]]; then
            echo "Missing site URL. For manual runs, enter academy_base_url; for automatic runs, set repository variable ACADEMY_BASE_URL." >&2
            exit 1
          fi
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          value = os.environ['ACADEMY_BASE_URL'].strip().rstrip('/')
          u = urlsplit(value)
          if u.scheme != 'https' or not u.hostname or u.username or u.password or u.query or u.fragment or u.path not in ('', '/'):
              raise SystemExit('ACADEMY_BASE_URL must be an HTTPS origin only, e.g. https://academy.example.com')
          print('Using HTTPS origin:', f'{u.scheme}://{u.netloc}')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform and build tools
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: gradle --no-daemon -p android-app assembleDebug "-PacademyBaseUrl=${ACADEMY_BASE_URL%/}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: infinite-academy-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
