name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-and-js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-local.txt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local test dependencies
        run: python -m pip install -r requirements-local.txt
      - name: Compile Python files
        run: python -m compileall -q app.py tests scripts
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in static/*.js; do
            node --check "$file"
          done
      - name: Run integration tests
        run: python -m unittest discover -s tests -v

  android-project-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform and build tools
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Android debug APK (placeholder origin, no secrets)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: gradle -p android-app assembleDebug -PacademyBaseUrl=https://academy.example.com
